<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can't Stop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="garden-wrap">
    
        <!-- Full-width 550px Header Banner -->

       
        <header class="site-header">
          <a href="index.html" class="header-link">
            <img src="benjiloone website1.png" alt="Dylan Coble" class="header-banner" width="550" height="80">
        </a>
        </header>
    
        <!-- Two-column row: 200px spacer + 350px content + photo-->
        <div class="layout-grid">
          
          <!-- 200px spacer mimicking Bernstein's left <td width="200">&nbsp;</td> -->
          <div class="spacer-col" aria-hidden="true"></div>
    
          <!-- 350px content column -->
          <main class="content-col">
            <h1>videos on youtube</h1>
    
            <p class="garden-body">
              Benji Loone played guitar in 
              <a href="youtubevids.html">Berea, Ohio</a> 
              in locations outside of a church and inside a fairground.
            </p>

            <div class="video-stack">

                <div class="video-entry">
                  <iframe width="560" height="315" src="https://www.youtube.com/embed/V86FiKIqqbI?si=Scqj7nxqj5zZ4pKu" 
                  title="YouTube video player" 
                  frameborder="0" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                  referrerpolicy="strict-origin-when-cross-origin" 
                  allowfullscreen></iframe>
                  <p class="caption">first video</p>
                </div>

                <div class="video-entry">
                    <iframe width="560" height="315" 
                    src="https://www.youtube.com/embed/-IWj9KvqpAU?si=gpJX8aiIQhvyqi_3" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen></iframe>
                    <p class="caption">second video</p>
                  </div>
            </div>

            <footer class="colophon">
              <p class="footer">
                Berea, Ohio &nbsp;&bull;&nbsp; 
                <a href="mailto:contact@example.com">Direct Inquiry &amp; Scores</a>
              </p>
              <p class="footer-meta">
                http://dylancoble.com/index.html
              </p>
            </footer>
          </main>
    
          <!--right side photo -->
          <aside class="photo-col">
            <img src="drawing.png" alt="Acoustic instrument detail or session photo" class="side-photo" width="300">
            <p class="caption">
                Daniel man was nothing 'cept the way he never was.
            </p>
          </aside>
        </div>
    
      </div>
</body>
</html>
